name: aramizdakioyuncucom
description: "Offical aramizdakiyuncu.com web project"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+5

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  html: ^0.15.5
  webview_flutter_platform_interface: ^2.10.0
  webview_flutter_web: ^0.2.3+4
  web_smooth_scroll: ^1.1.0

  armoyu_services: ^1.0.0+45
  armoyu_widgets: ^1.0.0+35

  get: ^4.6.6
  get_storage: ^2.1.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.6
  carousel_slider: ^5.0.0
  photo_view: ^0.15.0
  like_button: ^2.0.5
  font_awesome_flutter: ^10.8.0

  image_picker: ^1.1.2
  country_flags: ^3.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/