name: Auto Deploy Next

on:
  push:
    branches:
      - next

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync and Deploy
        run: |
          echo "Dosyalar güncelleniyor..."
          
          # 1. GitHub'dan inen tüm içeriği (nokta dahil) /app/next içine kopyala
          # /app şu an senin '02-subdomains' klasörün.
          # '.' Runner'ın o an içinde olduğu (yani taze kodların olduğu) yerdir.
          
          # Önce hedef klasörün var olduğundan emin olalım
          mkdir -p /app/next
          
          # İçeriği kopyala (Hata vermemesi için kopyalama yöntemini düzelttik)
          cp -rf ./* /app/next/
          cp -rf ./.[!.]* /app/next/ 2>/dev/null || true # Gizli dosyaları da (.env, .eslintrc vb.) alalım
          
          echo "Kopyalama tamamlandı. Docker başlatılıyor..."

          # 2. İşlem dizinine (02-subdomains) git
          cd /app
          
          # 3. Docker build başlasın
          docker compose up -d --build next
          
          # 4. Temizlik
          docker image prune -f