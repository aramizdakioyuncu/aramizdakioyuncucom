name: Auto Deploy Next

on:
  push:
    branches:
      - next

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync and Deploy
        run: |
          echo "Dosyalar güncelleniyor..."
          
          # Klasör hazırlığı
          mkdir -p /app/next
          
          # İçeriği kopyala
          cp -rf ./* /app/next/
          cp -rf ./.[!.]* /app/next/ 2>/dev/null || true 
          
          echo "Kopyalama tamamlandı. Docker işlemleri başlıyor..."

          # İşlem dizinine git
          cd /app
          
          # 1. Önce çakışan veya eski konteyneri zorla kaldır (Hata alsa bile devam etmesi için || true)
          # Bu adım, aldığın "Conflict" hatasını engelleyecektir.
          docker rm -f next_aramizdakioyuncucom || true

          # 2. Docker compose ile build et ve ayağa kaldır
          # --force-recreate ekleyerek her seferinde taze bir konteyner garantiliyoruz
          docker compose up -d --build --force-recreate next
          
          # 3. Temizlik
          docker image prune -f
