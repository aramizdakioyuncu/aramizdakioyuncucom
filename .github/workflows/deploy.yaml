name: Auto Deploy Next

on:
  push:
    branches:
      - next

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync and Deploy
        run: |
          echo "Dosyalar güncelleniyor..."
          
          # Klasör hazırlığı
          mkdir -p /app/next
          
          # İçeriği kopyala
          cp -rf ./* /app/next/
          cp -rf ./.[!.]* /app/next/ 2>/dev/null || true 
          
          echo "Kopyalama tamamlandı. Docker işlemleri başlıyor..."

          # İşlem dizinine git
          cd /app
          
          # 1. Önce çakışan veya eski konteyneri zorla kaldır
          docker rm -f next_aramizdakioyuncucom || true

          # 2. Bozuk buildkit snapshot cache'ini temizle (ana hata bu yüzden oluşuyor)
          docker buildx prune -f || true
          docker builder prune -f || true

          # 3. Docker compose ile build et ve ayağa kaldır
          docker compose up -d --build --force-recreate next
          
          # 4. Temizlik (dangling image'lar)
          docker image prune -f
