name: Auto Deploy Next

on:
  push:
    branches:
      - next

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Kodları güvenli bölgeye indirir

      - name: Sync and Deploy
        run: |
          # 1. Dosyaları senin fiziksel klasörüne (volume olan /app) kopyala
          # Bu sayede sunucuya girdiğinde dosyaları güncel görürsün.
          # '.' (nokta) Runner'ın indirdiği taze kodlardır.
          cp -rn ./* /app/ 2>/dev/null || cp -rf ./* /app/
          
          # 2. Artık senin o fiziksel klasörüne gidip işlemi yapalım
          cd /app/02-subdomains
          
          # 3. Docker build başlasın
          docker compose up -d --build next
          
          # 4. Temizlik
          docker image prune -f