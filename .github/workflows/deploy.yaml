name: Auto Deploy to Coolify

on:
  push:
    branches:
      - next  # `next` branch'ine yapılan push tetikler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build -t my-app .
          docker tag my-app your_dockerhub_account/my-app:latest
          docker push your_dockerhub_account/my-app:latest

      - name: Deploy to Coolify (via API)
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}  # GitHub Secrets'tan alır
        run: |
          curl -X POST https://api.coolify.app/v1/apps/your-app-id/deploy \
            -H "Authorization: Bearer $COOLIFY_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"image": "your_dockerhub_account/my-app:latest"}'