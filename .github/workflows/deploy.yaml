name: Auto Deploy Next

on:
  push:
    branches:
      - next

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync and Deploy
        run: |
          # 1. GitHub'dan gelen taze 'next' klasörünü ve dosyaları /app içine kopyala
          # Bu komut sunucundaki dosyaları güncelleyecek.
          cp -rf ./* /app/
          
          # 2. Doğrudan /app içinde (yani senin 02-subdomains klasöründe) komutu çalıştır
          cd /app
          docker compose up -d --build next
          
          # 3. Temizlik
          docker image prune -f