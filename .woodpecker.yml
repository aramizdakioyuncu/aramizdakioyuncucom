steps:
  - name: docker-build-and-push
    image: plugins/docker
    settings:
      repo: username/armoyu-next-app
      tags: latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event: push
      branch: next

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 172.18.0.1
      username: armoyu
      key:
        from_secret: ssh_key
      script:
        - docker pull username/armoyu-next-app:latest
        - docker stop next_aramizdakioyuncucom || true
        - docker rm next_aramizdakioyuncucom || true
        - docker run -d \
          --name next_aramizdakioyuncucom \
          --restart always \
          --network armoyu_network \
          -l "traefik.enable=true" \
          -l "traefik.http.routers.armoyu_next.rule=Host(`next.armoyu.com`) || Host(`next.aramizdakioyuncu.com`)" \
          -l "traefik.http.services.armoyu_next.loadbalancer.server.port=3000" \
          username/armoyu-next-app:latest
    when:
      event: push
      branch: next
