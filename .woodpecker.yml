steps:
  next-build:
    image: node:20-alpine
    commands:
      - "apk add --no-cache libc6-compat"
      - "npm ci --network-timeout 600000"
      - "npm run build"
    when:
      event: push
      branch: next

docker-package:
  image: plugins/docker
  settings:
    repo: "armoyu-next-app"
    dockerfile: "Dockerfile"
    context: "."
    tags: ["latest"]
    dry_run: true # <-- BURAYI EKLEDİK: İnternete yükleme, sadece yerelde oluştur.
  when:
    event: push
    branch: next

