steps:
  # 1. BÖLÜM: ÜRETİM (BUILD)
  build-image:
    image: plugins/docker
    settings:
      repo: "armoyu-next-app"
      dockerfile: "Dockerfile"
      context: "."
      tags: ["latest"]
    when:
      event: push
      branch: next

  # 2. BÖLÜM: YAYIN (DEPLOY) - SSH YÖNTEMİ
  deploy-to-prod:
    image: appleboy/drone-ssh
    settings:
      host: 172.18.0.1 # Docker gateway veya sunucu IP'n
      username: armoyu # BURAYI KONTROL ET (Ubuntu kullanıcı adın)
      key:
        from_secret: ssh_key
      port: 22
      script:
        # Mevcut konteynerı durdur/sil ve yeni imajla ayağa kaldır
        - "docker stop next_aramizdakioyuncucom || true"
        - "docker rm next_aramizdakioyuncucom || true"
        - "docker run -d --name next_aramizdakioyuncucom --restart always --network armoyu_network -l 'traefik.enable=true' -l 'traefik.http.routers.armoyu_next.rule=Host(`next.armoyu.com`) || Host(`next.aramizdakioyuncu.com`)' -l 'traefik.http.services.armoyu_next.loadbalancer.server.port=3000' armoyu-next-app:latest"
    when:
      event: push
      branch: next
